<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="664" viewBox="0 0 1040 664" role="img" aria-labelledby="title desc">
<title id="title">Chrome • Windows or Mac</title><desc id="desc">Chrome wording varies; the address-bar install icon is an alternative.. Numbered installation illustrations; not actual screenshots.</desc>
<rect width="100%" height="100%" fill="#edf2f7"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="34" font-size="12" font-weight="700" fill="#725019">ILLUSTRATION — NOT A DEVICE SCREENSHOT</text>
<text x="28" y="75" font-size="28" font-weight="700" fill="#182d40">Chrome • Windows or Mac</text>
<text x="28" y="107" font-size="16" fill="#425b70">Chrome wording varies; the address-bar install icon is an alternative.</text>
<g transform="translate(28 138)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">1</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Open the site</text>
<text x="20" y="70" font-size="14" fill="#52667a">Chrome → address bar</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Paste the published HTTPS URL</text>
<text x="20" y="157" font-size="14" fill="#425b70">Load online first. Do not use an incognito window.</text>
</g>
<g transform="translate(532 138)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">2</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Open installation</text>
<text x="20" y="70" font-size="14" fill="#52667a">Chrome ⋮ → Cast, save, and share</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Install page as app / Install Social Watch</text>
<text x="20" y="157" font-size="14" fill="#425b70">Use the address-bar Install icon if offered.</text>
</g>
<g transform="translate(28 370)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">3</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Confirm installation</text>
<text x="20" y="70" font-size="14" fill="#52667a">Browser installation dialog</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Install</text>
<text x="20" y="157" font-size="14" fill="#425b70">No executable or app-store account is required.</text>
</g>
<g transform="translate(532 370)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">4</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Launch and set up</text>
<text x="20" y="70" font-size="14" fill="#52667a">Created shortcut / application launcher</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Open Social Watch</text>
<text x="20" y="157" font-size="14" fill="#425b70">Create the local vault and connect accounts in this</text>
<text x="20" y="177" font-size="14" fill="#425b70">window.</text>
</g>
<text x="28" y="644" font-size="13" fill="#52667a">Social Watch visual guide • Labels and menu positions may vary by version.</text></g></svg>