<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="896" viewBox="0 0 1040 896" role="img" aria-labelledby="title desc">
<title id="title">Windows • Microsoft Edge</title><desc id="desc">Open the published HTTPS website, not its GitHub code page.. Numbered installation illustrations; not actual screenshots.</desc>
<rect width="100%" height="100%" fill="#edf2f7"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="34" font-size="12" font-weight="700" fill="#725019">ILLUSTRATION — NOT A DEVICE SCREENSHOT</text>
<text x="28" y="75" font-size="28" font-weight="700" fill="#182d40">Windows • Microsoft Edge</text>
<text x="28" y="107" font-size="16" fill="#425b70">Open the published HTTPS website, not its GitHub code page.</text>
<g transform="translate(28 138)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">1</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Open the site</text>
<text x="20" y="70" font-size="14" fill="#52667a">Microsoft Edge → address bar</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Paste the published website URL</text>
<text x="20" y="157" font-size="14" fill="#425b70">Load it online in a normal, non-private browser session.</text>
</g>
<g transform="translate(532 138)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">2</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Find installation</text>
<text x="20" y="70" font-size="14" fill="#52667a">Address-bar install icon, or Edge … menu</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Apps → Install this site as an app</text>
<text x="20" y="157" font-size="14" fill="#425b70">In some versions, Apps is under More tools.</text>
</g>
<g transform="translate(28 370)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">3</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Confirm</text>
<text x="20" y="70" font-size="14" fill="#52667a">Browser installation dialog</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Social Watch → Install</text>
<text x="20" y="157" font-size="14" fill="#425b70">This installs a browser web app, not an .exe.</text>
</g>
<g transform="translate(532 370)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">4</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Create a shortcut</text>
<text x="20" y="70" font-size="14" fill="#52667a">Optional browser prompt</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Pin to Start or taskbar</text>
<text x="20" y="157" font-size="14" fill="#425b70">Choose the shortcuts that suit you.</text>
</g>
<g transform="translate(28 602)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">5</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Launch</text>
<text x="20" y="70" font-size="14" fill="#52667a">Start menu / taskbar / edge://apps</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Open Social Watch</text>
<text x="20" y="157" font-size="14" fill="#425b70">Use the installed window for your vault and account setup.</text>
</g>
<g transform="translate(532 602)">
<rect width="480" height="208" rx="12" fill="white" stroke="#c5d1dc"/>
<circle cx="29" cy="30" r="16" fill="#354cdd"/>
<text x="29" y="36" text-anchor="middle" font-size="16" fill="white" font-weight="700">6</text>
<text x="56" y="36" font-size="19" font-weight="700" fill="#182d40">Create your vault</text>
<text x="20" y="70" font-size="14" fill="#52667a">Social Watch → first launch</text>
<rect x="18" y="86" width="444" height="45" rx="6" fill="#eaf0ff" stroke="#bcc8fc"/>
<text x="30" y="114" font-size="16" font-weight="700" fill="#243ba1">Create encrypted vault</text>
<text x="20" y="157" font-size="14" fill="#425b70">Use your own unique passphrase of at least 12 characters.</text>
</g>
<text x="28" y="876" font-size="13" fill="#52667a">Social Watch visual guide • Labels and menu positions may vary by version.</text></g></svg>